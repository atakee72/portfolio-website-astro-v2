backend:
  name: github
  repo: atakee72/portfolio-website-astro-v2
  branch: main

publish_mode: simple

media_library:
  name: cloudinary
  # false ⇒ the widget stores the full delivery URL, which keeps the folder
  # path (filename-only loses it — a paints/lens image would 404). cldPath
  # fields are normalized back to bare public_ids by src/content/config.ts;
  # blog mainImage renders the full URL directly.
  output_filename_only: false
  config:
    cloud_name: djgxiadrc
    api_key: '284812788854479'

media_folder: ''

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    extension: mdx
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{fields.title}}'
    sortable_fields: ['publishedAt', 'title']
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: text, required: true, hint: 'One-line summary shown in lists and meta tags.' }
      - { name: publishedAt, label: Published, widget: datetime, required: true, default: '' }
      - { name: updatedAt, label: Last updated, widget: datetime, required: false, hint: 'Set when you substantially revise a post — shown as "updated" and fed to search/AI as dateModified.' }
      - name: author
        label: Author
        widget: object
        required: true
        fields:
          - { name: name, label: Name, widget: string, required: true }
          - { name: image, label: Image URL, widget: string, required: false }
          - { name: bio, label: Bio, widget: text, required: false }
      - name: mainImage
        label: Main Image
        widget: object
        required: false
        hint: 'Cover image — click to open the Cloudinary library. Optional for linkposts.'
        fields:
          - { name: src, label: Source, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false }
      - { name: externalUrl, label: External URL, widget: string, required: false, hint: 'Linkpost — when set, the post title links to this URL. Leave empty for a regular post.' }
      - name: categories
        label: Categories
        widget: list
        required: false
        default: []
        field: { name: category, label: Category, widget: string }
      - name: stack
        label: Stack
        widget: list
        required: false
        default: []
        field: { name: tech, label: Tech, widget: string }
        hint: 'Technologies used or discussed in this post.'
      - { name: featured, label: Featured, widget: boolean, required: false, default: false, hint: 'Featured posts get a larger card on the homepage.' }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false, hint: 'Drafts are hidden in production but visible in dev.' }
      - { name: body, label: Body, widget: markdown }

  - name: rolls
    label: Photography Rolls
    label_singular: Roll
    folder: src/content/rolls
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    summary: '{{fields.title}} — {{fields.location}}'
    sortable_fields: ['date', 'title', 'location']
    fields:
      - { name: title, label: Title, widget: string, required: true, hint: 'Shown in the gallery index and on the roll page.' }
      - { name: date, label: Date, widget: datetime, required: true, default: '' }
      - { name: location, label: Location, widget: string, required: true }
      - name: tags
        label: Tags
        widget: list
        required: false
        default: []
        field: { name: tag, label: Tag, widget: string }
        hint: 'Filterable tags (e.g., berlin, 35mm, ektar).'
      - name: cover
        label: Cover (optional)
        widget: object
        required: false
        hint: 'Leave empty — the first photo in the list is the cover. Only set this to override.'
        fields:
          - { name: cldPath, label: Cloudinary image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false }
      - name: photos
        label: Photos
        widget: list
        required: true
        min: 1
        hint: 'Add at least one photo. Drag rows to reorder.'
        fields:
          - { name: cldPath, label: Cloudinary image, widget: image, required: true }
          - { name: alt, label: Alt text, widget: string, required: true }
          - { name: caption, label: Caption, widget: string, required: false }
          - name: exif
            label: EXIF
            widget: hidden
            required: false
            default: {}
      - { name: draft, label: Draft, widget: boolean, required: false, default: true, hint: 'Drafts are hidden on the live site.' }

  - name: paintings
    label: Painting Albums
    label_singular: Album
    folder: src/content/paintings
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    summary: '{{fields.title}} ({{fields.years}})'
    fields:
      - { name: title, label: Album title, widget: string, required: true, hint: 'e.g. My Early Paintings' }
      - { name: years, label: Years, widget: string, required: true, hint: 'e.g. 2022–2025' }
      - { name: dimensions, label: Dimensions, widget: string, required: false, hint: 'e.g. mostly A3' }
      - { name: description, label: Description, widget: text, required: false }
      - name: cover
        label: Cover (optional)
        widget: object
        required: false
        hint: 'Leave empty — the first painting in the list is the cover. Only set this to override.'
        fields:
          - { name: cldPath, label: Cloudinary image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false }
      - name: paintings
        label: Paintings
        label_singular: Painting
        widget: list
        required: true
        min: 1
        summary: '{{fields.title}} ({{fields.year}})'
        hint: 'One item per work. Drag rows to reorder — this is the display and prev/next order.'
        fields:
          - { name: id, label: ID (URL slug), widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'lowercase letters, digits and dashes only'], hint: 'e.g. boy-with-woodcock — becomes /paints/<album>/<id>. Don’t change after publishing.' }
          - { name: title, label: Title, widget: string, required: true }
          - { name: year, label: Year, widget: string, required: true, hint: 'e.g. 2024 or 2022–2024' }
          - { name: medium, label: Medium, widget: string, required: true, hint: 'e.g. Oil on canvas, Watercolour, Acrylic, Drawing, Mixed media, Gouache' }
          - name: subjects
            label: Subjects
            widget: list
            required: false
            default: []
            field: { name: subject, label: Subject, widget: string }
            hint: 'e.g. Nude, Portrait, Landscape, Still life'
          - { name: dimensions, label: Dimensions, widget: string, required: false, hint: 'e.g. 70×50 cm' }
          - { name: description, label: Description, widget: text, required: false }
          - name: image
            label: Image
            widget: object
            required: true
            fields:
              - { name: cldPath, label: Cloudinary image, widget: image, required: true }
              - { name: alt, label: Alt text, widget: string, required: true }
          - name: tags
            label: Extra tags
            widget: list
            required: false
            default: []
            field: { name: tag, label: Tag, widget: string }
            hint: 'Free-form (e.g. exhibited, sold, in-progress)'
      - { name: draft, label: Draft, widget: boolean, required: false, default: false, hint: 'Drafts hide the whole album on the live site.' }

  - name: projects
    label: Case Studies
    label_singular: Project
    folder: src/content/projects
    extension: mdx
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{fields.title}}'
    sortable_fields: ['publishedAt', 'title', 'featured']
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: subtitle, label: Subtitle, widget: string, required: true }
      - { name: publishedAt, label: Published, widget: datetime, required: true, default: '' }
      - { name: featured, label: Featured, widget: boolean, required: false, default: false, hint: 'Featured projects get a larger card on the homepage grid.' }
      - name: cover
        label: Cover
        widget: object
        required: true
        fields:
          - { name: src, label: Source, widget: image, required: true }
          - { name: alt, label: Alt text, widget: string, required: true }
          - { name: cloud, label: 'Use Cloudinary?', widget: boolean, required: false, default: false }
      - name: screenshots
        label: Screenshots
        widget: list
        required: false
        fields:
          - { name: src, label: Source, widget: image, required: true }
          - { name: alt, label: Alt text, widget: string, required: true }
          - { name: caption, label: Caption, widget: string, required: false }
          - { name: cloud, label: 'Cloudinary?', widget: boolean, required: false, default: false }
      - name: exif
        label: Meta
        widget: object
        required: true
        fields:
          - { name: stack, label: Stack summary, widget: string, required: true }
          - { name: year, label: Year, widget: string, required: true }
          - { name: status, label: Status, widget: select, options: ['live', 'wip', 'archived'], default: 'live', required: true }
          - { name: role, label: Role, widget: string, required: false }
          - name: tags
            label: Tags
            widget: list
            required: false
            field: { name: tag, label: Tag, widget: string }
      - name: links
        label: Links
        widget: object
        required: false
        fields:
          - { name: github, label: GitHub URL, widget: string, required: false }
          - { name: live, label: Live URL, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false, hint: 'Drafts are hidden in production but visible in dev.' }
      - { name: body, label: Body, widget: markdown }
